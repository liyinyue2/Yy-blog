services:
  nginx:
    image: nginx:alpine
    container_name: ysblog-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: ysblog-app
    restart: unless-stopped
    expose:
      - "8000"            # 仅容器网络内可见，不映射宿主机
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
