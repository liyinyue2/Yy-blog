<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="K's Blog — 记录思考，分享创造。" />
  <title>K's Blog — 记录思考，分享创造</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#fff; --ink:#111; --mute:#989898; --sub:#777; --soft:#8d8d8d; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body { background:var(--bg); color:var(--ink); font-family:Inter, "Noto Sans SC", system-ui, sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    a { color:inherit; text-decoration:none; }
    .hero { position:relative; height:100vh; min-height:660px; overflow:hidden; isolation:isolate; background:#fff; }
    #dots { position:absolute; inset:0; z-index:1; display:block; width:100%; height:100%; pointer-events:none; }
    nav { position:relative; z-index:3; display:flex; align-items:center; justify-content:center; gap:clamp(18px, 2.6vw, 40px); padding-top:36px; font-size:13.5px; line-height:1; }
    .brand { display:inline-flex; align-items:center; gap:8px; margin-right:10px; color:var(--ink); font-size:15px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; }
    .brand svg { display:block; width:16px; height:18px; fill:currentColor; }
    .links { display:flex; align-items:center; gap:clamp(18px, 2.6vw, 40px); }
    .links a { color:#3a3a3a; transition:color .2s ease; white-space:nowrap; }
    .links a:hover { color:#000; }
    .actions { display:flex; align-items:center; gap:10px; margin-left:10px; }
    .sign-in, .subscribe { border-radius:999px; padding:10px 20px; font-weight:500; white-space:nowrap; transition:transform .25s ease, background .25s ease, color .25s ease; }
    .sign-in { background:#111; color:#fff; }
    .subscribe { border:1px solid #111; background:#fff; color:#111; }
    .sign-in:hover, .subscribe:hover { transform:translateY(-1px); }
    .subscribe:hover { background:#111; color:#fff; }
    .copy { position:absolute; z-index:3; top:24.5%; left:50%; width:min(92vw, 760px); transform:translateX(-50%); text-align:center; }
    h1 { font-size:clamp(38px, 3.75vw, 68px); font-weight:500; line-height:1.08; letter-spacing:-.045em; }
    h1 .muted { display:block; color:var(--mute); }
    .subline { max-width:350px; margin:20px auto 0; color:var(--sub); font-size:clamp(13px, 1.02vw, 15.5px); line-height:1.55; }
    .cta { position:relative; display:inline-block; margin-top:clamp(34px, 3.6vw, 52px); isolation:isolate; }
    .cta::before { position:absolute; z-index:-1; right:10%; bottom:-6px; left:10%; height:16px; border-radius:50%; background:linear-gradient(90deg,#cfcfcf,#777,#cfcfcf); filter:blur(9px); opacity:.52; content:""; transition:opacity .3s ease, filter .3s ease, bottom .3s ease; }
    .cta a { position:relative; z-index:1; display:block; border-radius:999px; padding:11px 20px; background:#111; color:#fff; font-size:13.5px; font-weight:500; transition:transform .3s ease; }
    .cta:hover::before { bottom:-9px; filter:blur(12px); opacity:.8; }
    .cta:hover a { transform:translateY(-1px); }
    .socials { position:absolute; z-index:3; right:0; bottom:clamp(30px, 6vh, 64px); left:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:clamp(28px, 5vw, 70px); padding:0 16px; color:var(--soft); font-size:clamp(14px, 1.18vw, 17px); font-weight:500; letter-spacing:-.01em; line-height:1; }
    .social { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; transition:color .2s ease, transform .2s ease; }
    .social:hover { color:#111; transform:translateY(-1px); }
    .social svg { width:18px; height:18px; fill:currentColor; }
    @media (max-width:760px) {
      nav { justify-content:space-between; padding:22px 18px 0; }
      .links { display:none; }
      .brand, .actions { margin:0; }
      .actions { gap:8px; }
      .subscribe { display:none; }
      .copy { top:20%; }
      h1 { letter-spacing:-.055em; }
      .socials { gap:14px 26px; font-size:13px; }
      .social svg { width:16px; height:16px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .cta::before, .cta a, .sign-in, .subscribe, .links a, .social { transition:none; }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="K's Blog 首页">
    <canvas id="dots" aria-hidden="true"></canvas>

    <nav aria-label="博客主导航">
      <a class="brand" href="#" aria-label="K's Blog 首页">
        <svg viewBox="0 0 16 18" aria-hidden="true"><path d="M2 0h4v18H2zM7 9c3-1 5-4 6-9h3c-1 5-3 8-6 9 3 1 5 4 6 9h-3c-1-5-3-8-6-9z"/></svg>
        <span>K's Blog</span>
      </a>
      <div class="links" aria-label="博客分类">
        <a href="#home">首页</a>
        <a href="#articles">文章</a>
        <a href="#categories">分类</a>
        <a href="#tags">标签</a>
        <a href="#about">关于</a>
      </div>
      <div class="actions">
        <a class="subscribe" href="#subscribe">订阅</a>
        <a class="sign-in" href="#sign-in">登录</a>
      </div>
    </nav>

    <div class="copy">
      <h1><span class="muted">记录思考，</span>分享创造。</h1>
      <p class="subline">这是一个关于前端开发、UI设计与个人成长的自留地。</p>
      <div class="cta"><a href="#latest">阅读最新文章</a></div>
    </div>

    <div class="socials" aria-label="订阅与社交链接">
      <a class="social" href="#rss" aria-label="RSS订阅"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18.5A2.5 2.5 0 1 1 5 23a2.5 2.5 0 0 1 0-4.5zM3 11v3c3.87 0 7 3.13 7 7h3c0-5.52-4.48-10-10-10zm0-7v3c7.73 0 14 6.27 14 14h3C20 11.61 12.39 4 3 4z"/></svg><span>RSS订阅</span></a>
      <a class="social" href="#github" aria-label="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23A11.5 11.5 0 0 1 12 6.2c1.02 0 2.05.14 3.01.42 2.29-1.55 3.29-1.23 3.29-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.62-2.81 5.64-5.49 5.94.43.37.81 1.1.81 2.22v3.28c0 .32.22.69.83.57A12 12 0 0 0 12 .5z"/></svg><span>GitHub</span></a>
      <a class="social" href="#twitter" aria-label="Twitter X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.24l-4.89-6.38L6.49 22H3.38l7.24-8.28L2.8 2h6.4l4.42 5.84L18.9 2zm-1.1 17.9h1.73L8.28 4.04H6.42L17.8 19.9z"/></svg><span>Twitter (X)</span></a>
    </div>
  </section>

  <script>
    (() => {
      'use strict';
      const hero = document.querySelector('.hero');
      const canvas = document.getElementById('dots');
      const ctx = canvas.getContext('2d');
      let W = 0, H = 0, DPR = 1, step = 7, rows = 1, cols = 1, mapDots = [], start = performance.now();
      const fract = n => n - Math.floor(n);
      const hash = (a, b) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
      const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
      const continents = [
        [[.07,.31],[.10,.25],[.16,.23],[.21,.28],[.24,.36],[.22,.43],[.18,.47],[.16,.57],[.12,.62],[.10,.55],[.07,.47],[.05,.40]],
        [[.28,.21],[.33,.18],[.38,.20],[.42,.27],[.45,.34],[.43,.42],[.39,.49],[.35,.56],[.32,.66],[.29,.72],[.26,.65],[.27,.55],[.29,.46],[.27,.38]],
        [[.49,.29],[.53,.25],[.57,.27],[.60,.34],[.63,.38],[.66,.44],[.64,.51],[.60,.55],[.58,.63],[.54,.66],[.51,.59],[.50,.49],[.47,.41]],
        [[.66,.25],[.71,.22],[.77,.24],[.83,.29],[.88,.36],[.87,.43],[.82,.45],[.78,.42],[.74,.47],[.69,.44],[.66,.38]],
        [[.72,.54],[.76,.51],[.81,.54],[.84,.61],[.82,.69],[.77,.73],[.73,.68],[.70,.61]],
        [[.47,.77],[.54,.76],[.60,.78],[.64,.83],[.61,.87],[.54,.86],[.49,.83]]
      ];
      const inside = (x, y, polygon) => {
        let hit = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
          const xi = polygon[i][0], yi = polygon[i][1], xj = polygon[j][0], yj = polygon[j][1];
          const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
          if (intersect) hit = !hit;
        }
        return hit;
      };
      function resize() {
        W = hero.clientWidth; H = hero.clientHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        step = Math.max(5, W / 205); rows = Math.ceil(H / (step * 2.05)); cols = Math.ceil(W / step); mapDots = [];
        for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
          const x = (i + .5) / cols, y = (j + .5) / rows;
          if (continents.some(poly => inside(x, y, poly)) && hash(i, j) > .1) mapDots.push({ x: (i + .5) * step, y: (j + .5) * step * 2.05, seed: hash(i, j) });
        }
      }
      function render(time) {
        const t = time / 1000; const portrait = H > W; const quietCenter = portrait ? .34 : .39; const quietWidth = portrait ? .55 : .31; const quietHeight = portrait ? .21 : .18;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#111';
        for (const dot of mapDots) {
          const quietX = ((dot.x / W) - .5) / quietWidth; const quietY = ((dot.y / H) - quietCenter) / quietHeight;
          if (Math.hypot(quietX, quietY) < 1.05) continue;
          const pulse = .5 + .5 * Math.sin(t * 2.15 + dot.seed * 34);
          const wave = Math.sin(t * .72 - dot.x / Math.max(W, 1) * 8 + dot.seed * 5) * 1.25;
          const driftX = Math.sin(t * .28 + dot.seed * 10) * .7;
          const radius = Math.max(.8, step * (.17 + .31 * pulse));
          ctx.globalAlpha = .58 + .42 * pulse; ctx.beginPath(); ctx.arc(dot.x + driftX, dot.y + wave, radius, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      resize(); window.addEventListener('resize', resize, { passive:true }); window.__render = render;
      function frame(now) { render(now - start); requestAnimationFrame(frame); }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
