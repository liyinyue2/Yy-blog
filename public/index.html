<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="Kindred — reconnecting human creativity." />
  <title>Kindred — Reconnecting Human Creativity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f7f7f5; --ink:#111111; --mute:#9a9a9a; --sub:#7b7b7b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg);
      color:var(--ink);
      font-family:Inter, system-ui, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    a { color:inherit; text-decoration:none; }
    .hero {
      position:relative;
      min-height:660px;
      height:100vh;
      overflow:hidden;
      isolation:isolate;
      background:var(--bg);
    }
    #dots {
      position:absolute;
      inset:0;
      z-index:1;
      display:block;
      width:100%;
      height:100%;
      pointer-events:none;
    }
    nav {
      position:relative;
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(18px, 2.6vw, 40px);
      padding-top:36px;
      font-size:13.5px;
      line-height:1;
    }
    .brand {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-right:10px;
      color:var(--ink);
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
      white-space:nowrap;
    }
    .brand svg { display:block; width:16px; height:18px; fill:currentColor; }
    .links { display:flex; align-items:center; gap:clamp(18px, 2.6vw, 40px); }
    .links a { color:#3a3a3a; transition:color .2s ease; white-space:nowrap; }
    .links a:hover { color:#000; }
    .sign-in {
      margin-left:10px;
      border-radius:999px;
      padding:10px 21px;
      background:#111;
      color:#fff;
      font-weight:500;
      white-space:nowrap;
      transition:transform .25s ease;
    }
    .sign-in:hover { transform:translateY(-1px); }
    .copy {
      position:absolute;
      z-index:3;
      top:24.5%;
      left:50%;
      width:min(92vw, 720px);
      transform:translateX(-50%);
      text-align:center;
    }
    h1 {
      font-size:clamp(38px, 3.75vw, 68px);
      font-weight:500;
      line-height:1.04;
      letter-spacing:-.035em;
    }
    h1 .muted { display:block; color:var(--mute); }
    .subline {
      max-width:340px;
      margin:20px auto 0;
      color:var(--sub);
      font-size:clamp(13px, 1.02vw, 15.5px);
      line-height:1.4;
    }
    .cta {
      position:relative;
      display:inline-block;
      margin-top:clamp(34px, 3.6vw, 52px);
      isolation:isolate;
    }
    .cta::before {
      position:absolute;
      z-index:-1;
      right:10%;
      bottom:-6px;
      left:10%;
      height:16px;
      border-radius:50%;
      background:linear-gradient(90deg, #ffcf5a, #7dffa8, #5ad7ff, #9b7bff, #ff6fd8, #ffb36b);
      filter:blur(9px);
      opacity:.85;
      content:"";
      transition:opacity .3s ease, filter .3s ease, bottom .3s ease;
    }
    .cta a {
      position:relative;
      z-index:1;
      display:block;
      border-radius:999px;
      padding:11px 20px;
      background:#111;
      color:#fff;
      font-size:13.5px;
      font-weight:500;
      transition:transform .3s ease;
    }
    .cta:hover::before { bottom:-9px; filter:blur(12px); opacity:1; }
    .cta:hover a { transform:translateY(-1px); }
    .logos {
      position:absolute;
      z-index:3;
      right:0;
      bottom:clamp(28px, 6vh, 64px);
      left:0;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:clamp(26px, 4.6vw, 66px);
      padding:0 16px;
      color:#8d8d8d;
      font-size:clamp(14px, 1.18vw, 17px);
      font-weight:500;
      letter-spacing:-.01em;
      line-height:1;
    }
    .partner { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
    .partner svg { width:17px; height:17px; fill:currentColor; overflow:visible; }
    @media (max-width:760px) {
      nav { justify-content:space-between; padding:22px 18px 0; }
      .links { display:none; }
      .brand, .sign-in { margin:0; }
      .copy { top:20%; }
      .logos { gap:14px 24px; font-size:13px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .cta::before, .cta a, .sign-in, .links a { transition:none; }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="Kindred introduction">
    <canvas id="dots" aria-hidden="true"></canvas>

    <nav aria-label="Main navigation">
      <a class="brand" href="#" aria-label="Kindred home">
        <svg viewBox="0 0 16 18" aria-hidden="true"><path d="M2 0h4v18H2zM7 9c3-1 5-4 6-9h3c-1 5-3 8-6 9 3 1 5 4 6 9h-3c-1-5-3-8-6-9z"/></svg>
        <span>Kindred</span>
      </a>
      <div class="links" aria-label="Sections">
        <a href="#platform">Platform</a>
        <a href="#marketplace">Marketplace</a>
        <a href="#creators">Creators</a>
        <a href="#resources">Resources</a>
        <a href="#company">Company</a>
      </div>
      <a class="sign-in" href="#sign-in">Sign In</a>
    </nav>

    <div class="copy">
      <h1><span class="muted">Reconnecting</span>Human Creativity.</h1>
      <p class="subline">We’re not building another platform. We’re building a place where people belong.</p>
      <div class="cta"><a href="#join">Join the circle</a></div>
    </div>

    <div class="logos" aria-label="Creative community partners">
      <span class="partner"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15c0-7 5-12 14-12-1 9-6 14-13 13l-1 2-2-1z"/></svg>Lumenix</span>
      <span class="partner"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M10 1l8 4.5v9L10 19l-8-4.5v-9zM10 6l-4 2.3v4.4L10 15l4-2.3V8.3z"/></svg>Velora</span>
      <span class="partner"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1 5q4.5-3 9 0t9 0v3q-4.5 3-9 0t-9 0zm0 7q4.5-3 9 0t9 0v3q-4.5 3-9 0t-9 0z"/></svg>Nimbus</span>
      <span class="partner"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M10 1a9 9 0 110 18 9 9 0 010-18zm0 3a6 6 0 100 12 6 6 0 000-12zm0 3a3 3 0 110 6 3 3 0 010-6z"/></svg>Quanta</span>
      <span class="partner"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1 17L7 6l3 5 3-7 6 13z"/></svg>Solstice</span>
      <span class="partner"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l9 4-9 4-9-4zm-9 8l9 4 9-4v3l-9 4-9-4zm0 5l9 4 9-4v2l-9 4-9-4z"/></svg>Parallax</span>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      const SOURCE_URL = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261030_025250_100df7b8-31fd-4614-aa4a-c1b7d5b6b273.png&w=1600&q=85';
      const SRC = {
        LA: [0, .06, .47, .40],
        RA: [.53, .06, .47, .40],
        LB: [0, .55, .47, .40],
        RB: [.53, .55, .47, .40]
      };
      const LEVELS = [0, .26, .52, .78, 1];
      const LOOP = 20;
      const hero = document.querySelector('.hero');
      const canvas = document.getElementById('dots');
      const ctx = canvas.getContext('2d');

      let W = 0, H = 0, DPR = 1;
      let step = 5, rowStep = 10.25, cols = 1, rows = 1, R = 2.3;
      let portrait = false;
      let seeds = new Float32Array(1);
      let fA, fB, aCtx, bCtx;
      let tiles = {};
      let fieldsReady = false;
      let firstTime = performance.now();

      const fract = n => n - Math.floor(n);
      const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
      const hash = (a, b) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
      const smooth = (a, b, x) => {
        const u = clamp((x - a) / (b - a), 0, 1);
        return u * u * (3 - 2 * u);
      };
      const mixAt = (t, on, off, duration) => smooth(on, on + duration, t) * (1 - smooth(off, off + duration, t));

      function makeField() {
        const field = document.createElement('canvas');
        field.width = cols;
        field.height = rows;
        return field;
      }

      function resize() {
        W = hero.clientWidth;
        H = hero.clientHeight;
        DPR = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.imageSmoothingEnabled = false;

        portrait = H > W;
        step = Math.max(5, W / 205);
        rowStep = step * 2.05;
        cols = Math.ceil(W / step);
        rows = Math.ceil(H / rowStep);
        R = step * .46;
        seeds = new Float32Array(cols * rows);
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            seeds[j * cols + i] = .55 * hash(i, j) + .45 * hash(j * 3.1, 7.7);
          }
        }

        fA = makeField();
        fB = makeField();
        aCtx = fA.getContext('2d', { willReadFrequently: true });
        bCtx = fB.getContext('2d', { willReadFrequently: true });
      }

      function sliceTiles(image) {
        const iw = image.naturalWidth;
        const ih = image.naturalHeight;
        Object.entries(SRC).forEach(([name, rect]) => {
          const [rx, ry, rw, rh] = rect;
          const sx = Math.round(rx * iw);
          const sy = Math.round(ry * ih);
          const sw = Math.round(rw * iw);
          const sh = Math.round(rh * ih);
          const tile = document.createElement('canvas');
          tile.width = 420;
          tile.height = Math.max(1, Math.round(420 * sh / sw));
          const tileCtx = tile.getContext('2d');
          tileCtx.fillStyle = '#fff';
          tileCtx.fillRect(0, 0, tile.width, tile.height);
          tileCtx.imageSmoothingEnabled = true;
          tileCtx.imageSmoothingQuality = 'high';
          tileCtx.drawImage(image, sx, sy, sw, sh, 0, 0, tile.width, tile.height);
          tiles[name] = tile;
        });
        fieldsReady = true;
      }

      function drawHand(fieldCtx, tileName, left, seconds) {
        const a = 2 * Math.PI * seconds / LOOP;
        const phase = left ? 0 : Math.PI;
        const hw = W * (portrait ? .66 : .53);
        const hh = hw * ((.40 * 1520) / (.47 * 2688));
        const cy = H * (portrait ? .66 : .54);
        const reach = (.035 * Math.sin(a + phase) + .012 * Math.sin(2 * a + 1.3 + phase)) * W;
        const x = left ? reach - W * .045 : W - hw + W * .045 - reach;
        const scale = 1 + .07 * Math.sin(a + .9 + phase);
        const rotation = (left ? 1 : -1) * .045 * Math.sin(a + 2.1 + phase);
        const pivotX = left ? 0 : W;

        fieldCtx.save();
        fieldCtx.scale(cols / W, rows / H);
        fieldCtx.translate(pivotX, cy);
        fieldCtx.rotate(rotation);
        fieldCtx.scale(scale, scale);
        fieldCtx.translate(-pivotX, -cy);
        fieldCtx.imageSmoothingEnabled = true;
        fieldCtx.imageSmoothingQuality = 'high';
        fieldCtx.drawImage(tiles[tileName], x, cy - hh / 2, hw, hh);
        fieldCtx.restore();
      }

      function fillFields(seconds) {
        aCtx.setTransform(1, 0, 0, 1, 0, 0);
        bCtx.setTransform(1, 0, 0, 1, 0, 0);
        aCtx.fillStyle = '#fff';
        bCtx.fillStyle = '#fff';
        aCtx.fillRect(0, 0, cols, rows);
        bCtx.fillRect(0, 0, cols, rows);
        drawHand(aCtx, 'LA', true, seconds);
        drawHand(aCtx, 'RA', false, seconds);
        drawHand(bCtx, 'LB', true, seconds);
        drawHand(bCtx, 'RB', false, seconds);
      }

      function render(time) {
        const t = ((time % LOOP) + LOOP) % LOOP;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);
        if (!fieldsReady || !aCtx || !bCtx) return;

        fillFields(t);
        let pixelsA, pixelsB;
        try {
          pixelsA = aCtx.getImageData(0, 0, cols, rows).data;
          pixelsB = bCtx.getImageData(0, 0, cols, rows).data;
        } catch (error) {
          console.warn('Kindred hand source could not be sampled.', error);
          fieldsReady = false;
          return;
        }

        const leftMix = mixAt(t, 6.2, 14.6, 1.6);
        const rightMix = mixAt(t, 2.4, 10.4, 1.6);
        const tick = Math.floor(t * 7);
        const quietXWidth = portrait ? .44 : .2;
        const quietYCenter = portrait ? .33 : .385;
        const transitioningLeft = leftMix > .001 && leftMix < .999;
        const transitioningRight = rightMix > .001 && rightMix < .999;
        ctx.fillStyle = '#0d0d0d';

        for (let j = 0; j < rows; j++) {
          const shifted = hash(j, tick) > .965;
          const shift = shifted ? Math.round((hash(tick, j) - .5) * 8) : 0;
          const py = (j + .5) * rowStep;
          const ey = (py / H - quietYCenter) / .085;

          for (let i = 0; i < cols; i++) {
            const sampleI = clamp(i - shift, 0, cols - 1);
            const sampleIndex = (j * cols + sampleI) * 4;
            const index = j * cols + i;
            const seed = seeds[index];
            const mix = i < cols / 2 ? leftMix : rightMix;
            const onFront = i < cols / 2 ? transitioningLeft : transitioningRight;
            const data = seed < mix ? pixelsB : pixelsA;
            const lum = data[sampleIndex] / 255;
            let value = clamp((1 - lum - .16) / .42, 0, 1);
            if (value === 0) continue;

            value *= .86 + .14 * Math.sin(t * 3.2 + seed * 40);
            const centerDistance = Math.abs((i + .5) / cols - .5);
            value *= smooth(.035, .11, centerDistance);
            value *= smooth(.85, 1.25, Math.hypot(centerDistance / quietXWidth, ey));

            if (onFront) {
              const delta = Math.abs(seed - mix);
              if (delta < .12) {
                value *= delta / .12;
                if (hash(i + tick, j) <= .4) value *= .3;
              }
            }

            let level = 0;
            for (let n = LEVELS.length - 1; n > 0; n--) {
              if (value >= LEVELS[n] - .13) {
                level = LEVELS[n];
                break;
              }
            }
            if (!level) continue;
            const radius = level === .26 ? R * .38 : R * level;
            ctx.beginPath();
            ctx.arc((i + .5) * step, py, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      const source = new Image();
      source.crossOrigin = 'anonymous';
      source.onload = () => sliceTiles(source);
      source.onerror = () => console.warn('Kindred hand source failed to load.');
      source.src = SOURCE_URL;

      window.addEventListener('resize', resize, { passive: true });
      resize();
      window.__render = render;

      function frame(now) {
        render((now - firstTime) / 1000);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
