<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="音乐 — 在这里听博主收藏的声音。" />
<link rel="icon" type="image/svg+xml" href="/y-mark.svg" />
<link rel="stylesheet" href="/site.css" />
<title>音乐 — Y's Blog</title>
<style>
  .music-main { padding-bottom: 120px; }
  .track-table { width: 100%; border-top: 1px solid var(--hairline); }
  .track-row {
    display: grid; grid-template-columns: 44px 44px minmax(0,2fr) minmax(0,1fr) 64px;
    align-items: center; gap: 16px; padding: 12px 8px;
    border-bottom: 1px solid var(--hairline); cursor: pointer;
    transition: background var(--t-fast) var(--ease);
  }
  .track-row:hover { background: rgba(0,0,0,.025); }
  .track-row.is-playing { background: rgba(0,0,0,.045); }
  .track-row.is-playing .track-no { color: #111; font-weight: 600; }
  .track-no { color: #9ca3af; font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .track-cover {
    width: 44px; height: 44px; object-fit: cover; display: block;
    border: 1px solid var(--hairline); background: var(--surface); padding: 8px;
  }
  .track-title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-artist { color: #777; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-duration { color: #9ca3af; font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }

  .player-bar {
    position: fixed; z-index: 10; right: 0; bottom: 0; left: 0;
    display: grid; grid-template-columns: minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);
    align-items: center; gap: 24px; height: 72px; padding: 0 24px;
    border-top: 1px solid var(--hairline); background: var(--glass-bg-strong);
    -webkit-backdrop-filter: var(--glass-blur-thin); backdrop-filter: var(--glass-blur-thin);
  }
  .player-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .player-cover {
    width: 44px; height: 44px; flex: none; object-fit: cover;
    border: 1px solid var(--hairline); background: var(--surface); padding: 8px;
  }
  .player-text { min-width: 0; }
  .player-title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-artist { color: #9ca3af; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-center { display: grid; gap: 6px; }
  .player-buttons { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .player-buttons button {
    display: grid; place-items: center; width: 34px; height: 34px;
    background: none; color: #111; cursor: pointer;
  }
  .player-buttons button:hover { background: rgba(0,0,0,.06); }
  .player-buttons button:disabled { color: #c9c9c4; cursor: default; background: none; }
  .player-buttons svg { width: 16px; height: 16px; fill: currentColor; display: block; }
  .btn-play { border: 1px solid #111; border-radius: 50%; width: 38px !important; height: 38px !important; }
  .btn-play:hover { background: #111 !important; color: #fff; }
  .player-progress { display: flex; align-items: center; gap: 10px; }
  .player-time { color: #9ca3af; font-size: 11px; min-width: 36px; font-variant-numeric: tabular-nums; }
  .player-time:last-child { text-align: right; }
  .progress-track {
    position: relative; flex: 1; height: 14px; cursor: pointer;
    display: flex; align-items: center;
  }
  .progress-track::before {
    content: ""; position: absolute; right: 0; left: 0; height: 2px; background: rgba(0,0,0,.12);
  }
  .progress-fill {
    position: absolute; left: 0; height: 2px; width: 0;
    background: #111; pointer-events: none;
  }
  .player-volume { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .player-volume svg { width: 16px; height: 16px; fill: #777; flex: none; }
  .player-volume input[type=range] {
    width: 96px; height: 2px; appearance: none; -webkit-appearance: none;
    background: rgba(0,0,0,.2); outline: none; cursor: pointer;
  }
  .player-volume input[type=range]::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #111;
  }
  .player-volume input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border: none; border-radius: 50%; background: #111;
  }

  @media (max-width: 768px) {
    .music-main { padding-bottom: 88px; }
    .track-row { grid-template-columns: 32px 40px minmax(0,1fr) 48px; gap: 10px; padding: 10px 4px; }
    .track-artist { display: none; }
    .track-cover { width: 40px; height: 40px; }
    .player-bar {
      display: flex; align-items: center; gap: 12px;
      height: 56px; padding: 0 14px;
    }
    .player-info { flex: 1; }
    .player-cover { width: 36px; height: 36px; padding: 6px; }
    .player-artist { display: none; }
    .player-center { position: absolute; top: 0; right: 0; left: 0; }
    .player-buttons { display: contents; }
    .player-buttons .btn-prev, .player-buttons .btn-next { display: none; }
    .btn-play { width: 34px !important; height: 34px !important; order: 2; }
    .player-progress { position: absolute; top: -1px; right: 0; left: 0; }
    .player-time { display: none; }
    .progress-track { height: 8px; }
    .progress-track::before, .progress-fill { height: 2px; top: 0; }
    .player-volume { display: none; }
  }
</style>
</head>

<main class="page-main music-main reveal">
  <div class="page-head">
    <h1>音乐</h1>
    <p>博主收藏的声音。点击任意一行开始播放，列表循环。</p>
  </div>
  <div class="track-table" id="track-list">
    <p class="list-loading">正在加载曲目…</p>
  </div>
</main>

<footer class="page-footer">
  <div class="page-footer-inner"><span><span data-setting="site_name">Y's Blog</span> · 记录思考，分享创造。</span><a href="/articles.html">更多文章 →</a></div>
</footer>

<div class="player-bar" id="player-bar" aria-label="播放器">
  <div class="player-info">
    <img class="player-cover" id="p-cover" src="/y-mark.svg" alt="" />
    <div class="player-text">
      <div class="player-title" id="p-title">未在播放</div>
      <div class="player-artist" id="p-artist">—</div>
    </div>
  </div>
  <div class="player-center">
    <div class="player-buttons">
      <button class="btn-prev" id="btn-prev" type="button" aria-label="上一首" disabled><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button class="btn-play" id="btn-play" type="button" aria-label="播放" disabled>
        <svg id="icon-play" viewBox="0 0 16 16"><path d="M4 2l9 6-9 6z"/></svg>
        <svg id="icon-pause" viewBox="0 0 16 16" style="display:none"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg>
      </button>
      <button class="btn-next" id="btn-next" type="button" aria-label="下一首" disabled><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    </div>
    <div class="player-progress">
      <span class="player-time" id="time-cur">0:00</span>
      <div class="progress-track" id="progress-track" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="player-time" id="time-total">0:00</span>
    </div>
  </div>
  <div class="player-volume">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6v4h3l4 3.5v-11L5 6H2zm9.5 2a2.5 2.5 0 0 0-1.5-2.3v4.6A2.5 2.5 0 0 0 11.5 8z"/></svg>
    <input type="range" id="volume" min="0" max="100" value="80" aria-label="音量" />
  </div>
</div>

<div class="toast" id="toast" aria-live="polite"></div>
<script src="/site.js"></script>
<script src="/music.js"></script>
</body>
</html>
