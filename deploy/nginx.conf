server {
    listen 80;
    server_name _;

    # 静态站点（public/ 冻结，与 v1 完全一致）
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 请求体上限与代理超时（与 v1.0 后端限制对齐）
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 上传目录严禁出现在静态根路径——无此 location，天然 404

    # API 反代到 FastAPI（容器内网 8000，不暴露公网）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSS 同走后端动态生成
    location = /rss.xml {
        proxy_pass http://app:8000/api/rss;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 文章详情页动态渲染
    location ~ ^/post-[\w-]+\.html$ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
